[project]
name = "iparty"
version = "1.3.0"
description = "Verifier-gated birthday-party planning on the TTL reliability engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "anthropic>=0.39",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "ruff>=0.14,<0.16",   # bounded: ruff default rules shift between minors
]

[project.scripts]
iparty = "iparty.api.app:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

# Rules are selected EXPLICITLY. Ruff's default rule set changes between
# releases, so relying on it made CI fail after an unrelated ruff upgrade
# (a green local run and a red CI run for identical code). Pinning the
# selection here — plus a bounded ruff version in the dev extra — makes lint
# reproducible.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    # Party dates are local calendar dates, not instants: date.today() is the
    # correct call and tz-aware datetimes would be wrong here (DTZ011).
    "DTZ011",
    # Blind `except Exception` is deliberate at orchestration boundaries; those
    # sites are individually annotated with noqa where they occur.
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
# Test helpers legitimately shadow builtins and use long inline fixtures.
"tests/*" = ["E501"]
"scripts/*" = ["E501"]
